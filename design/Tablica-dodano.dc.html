<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Wydarzenie dodane</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens/theme.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
:focus-visible{outline:3px solid #1C2430;outline-offset:2px;box-shadow:0 0 0 2px #FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; font-family: Montserrat, sans-serif; color: #1C2430; overflow: hidden">
  <main style="flex: 1; overflow: auto; display: flex; flex-direction: column">
    <dc-import name="Potwierdzenie" wariant="duzy" tytul="Wydarzenie jest na tablicy" opis="{{nazwa}}" zamknij-href="Tablica-sasiedzi.dc.html" hint-size="390px,325px"></dc-import>
    <div style="padding: 18px 28px 0; display: flex; flex-direction: column; gap: 18px">
      <p style="margin: 0; font-size: 13px; color: #5A6575; text-align: center">{{kiedy}} · {{godzina}} · {{miejsce}}</p>

      <div style="margin-top: 8px; width: 100%; box-sizing: border-box; background: #F5F7FA; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; text-align: left; align-items: flex-start">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; stroke: var(--theme-primary, #1D5FA8)"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span style="font-size: 13px; line-height: 1.5; color: #2B3442">Sąsiedzi zobaczą dokładne miejsce po kliknięciu „Wpadam”. Rada osiedla czuwa nad tablicą.</span>
      </div>
    </div>
  </main>

  <div style="padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 10px">
    <a href="Tablica-sasiedzi.dc.html" style="min-height: 52px; border-radius: 999px; background: var(--theme-primary, #1D5FA8); color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">Zobacz na tablicy</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let w = {};
    try {
      w = JSON.parse(sessionStorage.getItem('mojeOsiedle.wydarzenie') || '{}') || {};
    } catch (e) {}
    let kiedy = 'sob., 24 października';
    if (w.data) {
      const d = new Date(w.data + 'T12:00:00');
      if (!isNaN(d)) kiedy = d.toLocaleDateString('pl-PL', { weekday: 'short', day: 'numeric', month: 'long' });
    }
    return {
      nazwa: w.nazwa || 'Sprzątanie Parku Źródliska',
      kiedy,
      godzina: w.godzina || '10:00',
      miejsce: w.miejsce || 'Park Źródliska'
    };
  }
}
</script>
</body>
</html>
