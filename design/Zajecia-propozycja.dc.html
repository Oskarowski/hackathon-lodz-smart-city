<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zaproponuj zajęcia</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens/theme.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
:focus-visible{outline:3px solid #1C2430;outline-offset:2px;box-shadow:0 0 0 2px #FFFFFF}
label:has(input:focus-visible){outline:3px solid #1C2430;outline-offset:2px;box-shadow:0 0 0 2px #FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F5F7FA; font-family: Montserrat, sans-serif; color: #1C2430; overflow: hidden">
  <dc-import name="Naglowek" tytul="Zaproponuj zajęcia" podtytul="Osiedle Parkowe" wstecz-href="Zajecia-lista.dc.html" wstecz-etykieta="Wróć do propozycji zajęć" hint-size="390px,74px"></dc-import>

  <main style="flex: 1; overflow: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="zajecia-temat" style="font-size: 13px; font-weight: 600">Temat zajęć</label>
      <input id="zajecia-temat" type="text" placeholder="np. Robotyka dla dzieci" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #7D8A9C; background: #FFFFFF; font: 500 15px Montserrat, sans-serif; color: #1C2430">
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600">Dla kogo</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{grupy}}" as="grupa" hint-placeholder-count="5">
          <sc-if value="{{grupa.wybrana}}" hint-placeholder-val="{{ false }}">
            <label style="position: relative; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #1C2430; background: #1C2430; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; box-sizing: border-box; cursor: pointer">
              <input type="radio" name="dla-kogo" value="{{grupa.id}}" checked="{{grupa.wybrana}}" onChange="{{grupa.wybierz}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M20 6L9 17l-5-5"/></svg>
              {{grupa.etykieta}}
            </label>
          </sc-if>
          <sc-if value="{{grupa.niewybrana}}" hint-placeholder-val="{{ true }}">
            <label style="position: relative; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #7D8A9C; background: #FFFFFF; color: #1C2430; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; box-sizing: border-box; cursor: pointer">
              <input type="radio" name="dla-kogo" value="{{grupa.id}}" checked="{{grupa.wybrana}}" onChange="{{grupa.wybierz}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0">
              {{grupa.etykieta}}
            </label>
          </sc-if>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="zajecia-opis" style="font-size: 13px; font-weight: 600">Opis</label>
      <textarea id="zajecia-opis" rows="4" placeholder="Czego chcesz się nauczyć i jak często?" aria-describedby="zajecia-opis-wskazowka" style="min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid #7D8A9C; background: #FFFFFF; font: 500 15px Montserrat, sans-serif; color: #1C2430; resize: vertical"></textarea>
      <span id="zajecia-opis-wskazowka" style="font-size: 12px; color: #5A6575">Napisz, czego chcesz się nauczyć.</span>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--theme-primary-soft, #E8EFF8)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; stroke: var(--theme-primary, #1D5FA8)"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #1C2430">Przekażemy temat instytucjom miejskim, np. domom kultury i bibliotekom. Gdy zbierze się dość chętnych z osiedla, instytucja zaproponuje terminy.</p>
    </div>
  </main>

  <div style="padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #D9E1EA">
    <a href="Zajecia-zaproponowano.dc.html" onClick="{{zapisz}}" style="min-height: 52px; border-radius: 999px; background: var(--theme-primary, #1D5FA8); color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box; font-size: 15px; font-weight: 700">Wyślij propozycję</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dlaKogo: 'dzieci' };
  }
  renderVals() {
    const grupy = [
      { id: 'dzieci', etykieta: 'Dzieci' },
      { id: 'mlodziez', etykieta: 'Młodzież' },
      { id: 'dorosli', etykieta: 'Dorośli' },
      { id: 'seniorzy', etykieta: 'Seniorzy' },
      { id: 'wszyscy', etykieta: 'Wszyscy' }
    ];
    return {
      zapisz: () => {
        try {
          sessionStorage.setItem('mojeOsiedle.propozycja', (document.getElementById('zajecia-temat').value || '').trim());
        } catch (e) {}
      },
      grupy: grupy.map((g) => ({
        ...g,
        wybrana: this.state.dlaKogo === g.id,
        niewybrana: this.state.dlaKogo !== g.id,
        wybierz: () => this.setState({ dlaKogo: g.id })
      }))
    };
  }
}
</script>
</body>
</html>
