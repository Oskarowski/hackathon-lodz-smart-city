<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Głos oddany</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens/theme.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
:focus-visible{outline:3px solid #1C2430;outline-offset:2px;box-shadow:0 0 0 2px #FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; font-family: Montserrat, sans-serif; color: #1C2430; overflow: hidden">
  <main style="flex: 1; display: flex; flex-direction: column">
    <dc-import name="Potwierdzenie" wariant="duzy" tytul="Twój głos został oddany" opis="Termomodernizacja i nowa elewacja szkoły podstawowej" karta="true" zamknij-href="BO-lista.dc.html" hint-size="390px,370px"></dc-import>
    <div style="padding: 20px 28px 0; display: flex; flex-direction: column; gap: 20px">
      <div style="margin-top: 12px; width: 100%; box-sizing: border-box; background: #F5F7FA; border-radius: 16px; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 4px; text-align: left">
        <div style="display: flex; gap: 12px; align-items: flex-start">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; stroke: var(--theme-primary, #1D5FA8)"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span aria-live="polite" style="font-size: 13px; line-height: 1.5; color: #2B3442">
            <sc-if value="{{nieSledzi}}" hint-placeholder-val="{{ true }}">Nie śledzisz realizacji tego projektu.</sc-if>
            <sc-if value="{{sledzi}}" hint-placeholder-val="{{ false }}">Śledzisz ten projekt. Damy Ci znać, gdy przejdzie do realizacji.</sc-if>
          </span>
        </div>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px; font-weight: 600">
          <input type="checkbox" checked="{{sledzi}}" onChange="{{przelacz}}" style="flex: none; width: 20px; height: 20px; margin: 0 1px; accent-color: var(--theme-primary, #1D5FA8)">
          Powiadamiaj mnie o realizacji
        </label>
      </div>
    </div>
  </main>

  <div style="padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 10px">
    <a href="Sprawy-lista.dc.html" style="min-height: 52px; border-radius: 999px; background: var(--theme-primary, #1D5FA8); color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">Zobacz w Moich sprawach</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sledzi: false };
  }
  renderVals() {
    const { sledzi } = this.state;
    return {
      sledzi: sledzi,
      nieSledzi: !sledzi,
      przelacz: () => this.setState({ sledzi: !sledzi })
    };
  }
}
</script>
</body>
</html>
