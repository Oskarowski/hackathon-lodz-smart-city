<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Dodaj wydarzenie</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens/theme.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
:focus-visible{outline:3px solid #1C2430;outline-offset:2px;box-shadow:0 0 0 2px #FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F5F7FA; font-family: Montserrat, sans-serif; color: #1C2430; overflow: hidden">
  <dc-import name="Naglowek" tytul="Dodaj wydarzenie" podtytul="Tablica · Osiedle Parkowe" wstecz-href="Tablica-sasiedzi.dc.html" wstecz-etykieta="Wróć do tablicy" hint-size="390px,74px"></dc-import>

  <main style="flex: 1; overflow: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #2B3442">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E8E3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
      Dodajesz jako zweryfikowany mieszkaniec
    </span>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="wydarzenie-nazwa" style="font-size: 13px; font-weight: 600">Nazwa wydarzenia</label>
      <input id="wydarzenie-nazwa" type="text" placeholder="np. Sprzątanie Parku Źródliska" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #7D8A9C; background: #FFFFFF; font: 500 15px Montserrat, sans-serif; color: #1C2430">
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="wydarzenie-data" style="font-size: 13px; font-weight: 600">Data</label>
        <input id="wydarzenie-data" type="date" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #7D8A9C; background: #FFFFFF; font: 500 15px Montserrat, sans-serif; color: #1C2430">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="wydarzenie-godzina" style="font-size: 13px; font-weight: 600">Godzina</label>
        <input id="wydarzenie-godzina" type="time" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #7D8A9C; background: #FFFFFF; font: 500 15px Montserrat, sans-serif; color: #1C2430">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="wydarzenie-miejsce" style="font-size: 13px; font-weight: 600">Miejsce</label>
      <input id="wydarzenie-miejsce" type="text" placeholder="np. Park Źródliska, przy fontannie" aria-describedby="wydarzenie-miejsce-wskazowka" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #7D8A9C; background: #FFFFFF; font: 500 15px Montserrat, sans-serif; color: #1C2430">
      <span id="wydarzenie-miejsce-wskazowka" style="font-size: 12px; color: #5A6575">Dokładne miejsce zobaczą tylko osoby, które klikną „Wpadam”.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="wydarzenie-opis" style="font-size: 13px; font-weight: 600">Opis</label>
      <textarea id="wydarzenie-opis" rows="4" placeholder="Napisz, co planujesz i co warto ze sobą zabrać." style="min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid #7D8A9C; background: #FFFFFF; font: 500 15px Montserrat, sans-serif; color: #1C2430; resize: vertical"></textarea>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--theme-primary-soft, #E8EFF8)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; stroke: var(--theme-primary, #1D5FA8)"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #1C2430">Wydarzenie od razu pojawi się na tablicy Osiedla Parkowego w sekcji „Od sąsiadów”. Rada osiedla może je ukryć, jeśli sąsiedzi je zgłoszą.</p>
    </div>
  </main>

  <div style="padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #D9E1EA">
    <a href="Tablica-dodano.dc.html" onClick="{{zapisz}}" style="min-height: 52px; border-radius: 999px; background: var(--theme-primary, #1D5FA8); color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box; font-size: 15px; font-weight: 700">Opublikuj wydarzenie</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      zapisz: () => {
        const pole = (id) => (document.getElementById(id).value || '').trim();
        try {
          sessionStorage.setItem('mojeOsiedle.wydarzenie', JSON.stringify({
            nazwa: pole('wydarzenie-nazwa'),
            data: pole('wydarzenie-data'),
            godzina: pole('wydarzenie-godzina'),
            miejsce: pole('wydarzenie-miejsce')
          }));
        } catch (e) {}
      }
    };
  }
}
</script>
</body>
</html>
