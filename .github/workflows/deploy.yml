# Builds the PWA and publishes it to GitHub Pages at https://barrio.jdex.pl.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions",
# then Custom domain: barrio.jdex.pl. The domain itself ships in public/CNAME.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but a running
# deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          for f in index.html manifest.webmanifest sw.js CNAME; do
            test -s "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          echo "Publishing for $(cat dist/CNAME)"

      - uses: actions/configure-pages@v6

      # v5 uploads with upload-artifact v7; it must be paired with deploy-pages v5.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
